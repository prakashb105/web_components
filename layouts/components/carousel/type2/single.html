<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 10 Years of Zoho Inventory Styles */
        body {
            font-family: "Zoho Puvi", -apple-system, BlinkMacSystemFont, "San Francisco", "Helvetica Neue", Helvetica, Ubuntu, Roboto, Noto, "Segoe UI", Arial, sans-serif;
            font-weight: 400;
            margin: 0;
        }

        body.modal-open {
            overflow: hidden;
        }

        .d-flex {
            display: flex;
        }

        .cursor-pointer {
            cursor: pointer;
        }

        .txt-aln-center {
            text-align: center;
        }

        .page-wrapper {
            max-width: 1280px;
            margin: auto;
            width: 90%;
        }

        a {
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        .main-wrapper {
            background: linear-gradient(to top, #fff 0%, #ffefcf 100%);
            position: relative;
            z-index: 1;
        }

        .highlighted-text {
            display: inline-block;
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
        }

        /* Fixed Left Sidebar */
        .fixed-left-sidebar {
            position: fixed;
            right: 30px;
            bottom: 30px;
            background-color: #fff;
            border-radius: 14px;
            padding: 5px;
            z-index: 99999999;
            opacity: 0;
            transition: all 0.4s ease;
            width: 150px;
            box-sizing: border-box;
            border: 1px solid #dbdbdb;
        }

        .fixed-left-sidebar.show {
            opacity: 1;
            pointer-events: auto;
        }

        .fixed-left-sidebar .sidebar-image-wrapper {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        .fixed-left-sidebar .sidebar-image-wrapper img {
            width: 100%;
            margin-bottom: -5px;
            transition: transform 0.3s ease;
        }

        .fixed-left-sidebar .sidebar-image-wrapper:hover img {
            transform: scale(1.05);
        }

        .fixed-left-sidebar .sidebar-content p {
            font-size: 14px;
            color: #000;
            margin: 6px auto 10px;
            line-height: 18px;
            font-weight: 600;
            text-align: center;
        }

        /* Video Player */
        .video-player {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #FFF4DE;
            opacity: 0;
            padding: 100px;
            z-index: 10000;
            transition: opacity 0.3s;
        }

        .video-player.open {
            opacity: 1;
        }

        .video-player .player-wrapper {
            max-width: 1000px;
            margin: auto;
        }

        .hide {
            display: none;
        }

        .video-player .player {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-player .player iframe {
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 16px;
            width: 100%;
            height: 100%;
        }

        .close {
            position: absolute;
            right: 32px;
            top: 32px;
            width: 32px;
            height: 32px;
            opacity: 0.5;
            transition: opacity 0.25s;
            cursor: pointer;
        }

        .close:hover {
            opacity: 1;
        }

        .close:before,
        .close:after {
            position: absolute;
            left: 15px;
            content: " ";
            height: 33px;
            width: 2px;
            background-color: #666;
        }

        .close:before {
            transform: rotate(45deg);
        }

        .close:after {
            transform: rotate(-45deg);
        }

        /* Navbar Section */
        .navbar-section {
            position: sticky;
            top: 0;
            background-color: #ffefcfe6;
            z-index: 9999;
        }

        .navbar-container {
            padding: 14px 0;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ffe0a6;
        }

        .navbar-logo {
            width: 157px;
        }

        .navbar-menu-list {
            gap: 40px;
        }

        .navbar-menu-item {
            font-size: 16px;
            color: #000;
        }

        .navbar-contact-us {
            background-color: #f94049;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            line-height: 25px;
            text-transform: uppercase;
            padding: 7px 15px;
            border-radius: 6px;
        }

        /* Header Section */
        .header-sec {
            padding-top: 50px;
            position: relative;
        }

        .header-sec-inner {
            text-align: center;
        }

        .header-image-wrapper {
            position: relative;
            display: inline-block;
        }

        .header-image-wrapper img {
            display: block;
        }

        .header-image-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(180deg, rgba(255, 243, 219, 0) 0%, #fff3db 100%);
            pointer-events: none;
        }

        .ten-year-animation svg {
            max-width: 600px;
        }

        .header-title {
            letter-spacing: -2px;
            text-align: center;
            padding-top: 30px;
        }

        .header-title span {
            font-size: 62px;
            line-height: 77px;
            letter-spacing: -2px;
            display: inline-block;
        }

        .text-red {
            font-weight: 800;
            font-size: 62px;
            line-height: 77px;
            letter-spacing: -2px;
            color: #f94049;
            text-align: center;
            display: inline-block;
        }

        .header-desc {
            max-width: 565px;
            margin: auto;
            letter-spacing: 0.4px;
        }

        .cust-with-emoji {
            background-image: url("/inventory/10-years-of-zoho-inventory/customer-img.png");
            background-size: 390px 120px;
            width: 60px;
            height: 60px;
        }

        .header-sec>span {
            position: absolute;
            z-index: 99;
        }

        .customer-3 {
            background-position: -211px -30px;
        }

        .customer-2 {
            background-position: 89px -30px;
        }

        .customer-1 {
            background-position: 269px -30px;
        }

        .customer-4 {
            background-position: -31px -30px;
        }

        .item-1 {
            top: 34%;
            left: 17%;
        }

        .item-2 {
            top: 28%;
            right: 12%;
        }

        .item-3 {
            top: 71%;
            left: 22%;
        }

        .item-4 {
            top: 71%;
            right: 18%;
        }

        .animate-tooltip {
            padding: 10px 14px;
            border-radius: 10px 10px 10px 0px;
            font-size: 10px;
            position: absolute;
            top: -42px;
            display: none;
            background-color: #fff;
            line-height: 16px;
            color: #000;
            animation: wide 1s ease-in-out;
            animation-fill-mode: forwards;
            transform: scale(0);
            transform-origin: bottom left;
        }

        .animate-tooltip span {
            display: block;
            font-size: 12px;
            font-weight: 500;
        }

        .left-origin {
            transform-origin: bottom right;
        }

        @keyframes wide {
            0% {
                transform: scale(0);
            }

            50% {
                transform: scale(1.10);
            }

            100% {
                transform: scale(1);
            }
        }

        .item-1 .animate-tooltip {
            left: -175px;
            top: -45px;
            border-radius: 15px 15px 0px 15px;
        }

        .item-2 .animate-tooltip {
            left: 53px;
            top: -47px;
        }

        .item-3 .animate-tooltip {
            right: 60px;
            top: -57px;
            border-radius: 15px 15px 0px 15px;
        }

        .item-4 .animate-tooltip {
            left: 53px;
            top: -50px;
        }

        .active-tooltip .animate-tooltip {
            min-width: 150px;
            display: block;
            text-align: center;
        }

        .round-shape {
            border-radius: 50%;
        }

        .bg-red-big-lt,
        .bg-red-big-rt {
            background-color: #E42527;
            width: 33px;
            opacity: 0.3;
            height: 33px;
        }

        .bg-red-big-lt {
            top: 20%;
            left: 20%;
        }

        .bg-red-big-rt {
            top: 45%;
            right: 20%;
        }

        .bg-black-medium {
            background-color: #000;
            width: 29px;
            height: 29px;
            opacity: 0.3;
            top: 55%;
            left: 13%;
        }

        .bg-yellow-small {
            background-color: #ffce6c;
            width: 18px;
            height: 18px;
            top: 52%;
            left: 22%;
            opacity: 0.7;
        }

        .bg-black-small {
            background-color: #000;
            width: 22px;
            height: 22px;
            top: 23%;
            right: 23%;
            opacity: 0.3;
        }

        .bg-yellow-small-rt {
            background-color: #ffce6c;
            width: 18px;
            height: 18px;
            top: 58%;
            right: 12%;
            opacity: 0.7;
        }

        /* Story Section */
        .story-section {
            padding: 40px 0 60px;
            position: relative;
            overflow: hidden;
        }

        .story-section::before {
            content: '';
            position: absolute;
            top: 150px;
            right: 0;
            width: 60%;
            height: auto;
            aspect-ratio: 1;
            background-image: url('/inventory/10-years-of-zoho-inventory/bg-cloud-full.png');
            background-repeat: no-repeat;
            background-size: contain;
            will-change: transform;
            transform: translateY(var(--cloud-offset, 0px));
        }

        .story-section::after {
            content: '';
            position: absolute;
            bottom: 20%;
            left: 0;
            width: 30%;
            height: auto;
            aspect-ratio: 1;
            background-image: url('/inventory/10-years-of-zoho-inventory/bg-cloud-cut.png');
            background-repeat: no-repeat;
            background-size: contain;
            will-change: transform;
            transform: translateY(var(--cloud-offset, 0px));
        }

        .story-container {
            max-width: 690px;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        .story-text-container {
            justify-content: center;
            flex-direction: column;
            gap: 40px;
        }

        .story-section-inner {
            flex-direction: column;
        }

        .story-content {
            font-weight: 300;
            font-size: 28px;
            line-height: 50px;
        }

        .story-word {
            opacity: 0.1;
            transition: opacity 0.3s ease-out;
        }

        .story-closing-image {
            padding: 60px 0;
            width: 550px;
        }

        .story-image-zom {
            width: 180px;
            height: 180px;
        }

        /*feature section*/
        .feature-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0.5;
            background-color: #fff;
            height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        .feature-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            padding: 85px 65px;
            border: 1px solid #c6c6c6;
            border-radius: 24px;
            background-color: #fff;
            box-sizing: border-box;
            width: 95%;
            margin: auto;
            max-width: 1360px;
            max-height: 650px;
            gap: 40px;
            display: none;
            flex-direction: row;
            z-index: 1000;
            opacity: 0;
            transition: all 1s ease;
        }

        .feature-container.animate-show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .close-icon {
            position: absolute;
            top: -30px;
            right: -10px;
            z-index: 999999;
        }

        .feature-content {
            width: 40%;
        }

        .feature-image-animation {
            width: 60%;
            position: relative;
        }

        /* All Features Section Gradients */
        .all-features-section {
            position: relative;
            padding: 30px 0;
            width: 90%;
            max-width: 1360px;
            margin: auto;
        }

        .all-feature-animation {
            position: relative;
        }

        .all-feature-animation::before {
            content: '';
            position: absolute;
            top: 0px;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(180deg, #fff 0%, rgba(252, 248, 240, 0) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .all-feature-animation::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 125px;
            background: linear-gradient(0deg, #fff 0%, rgba(252, 248, 240, 0) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .animation-wrapper {
            position: relative;
        }

        .animation-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 85px;
            background: linear-gradient(90deg, #fff 0%, rgba(252, 248, 240, 0) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .animation-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 85px;
            background: linear-gradient(270deg, #fff 0%, rgba(252, 248, 240, 0) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .all-feature-animation div {
            display: block;
            width: 100%;
        }

        .feature-text {
            max-height: 500px;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 140px), transparent 100%);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 140px), transparent 100%);
        }

        .feature-text::-webkit-scrollbar {
            display: none;
        }

        .feature-title {
            font-weight: 600;
            font-size: 38px;
            line-height: 48px;
            margin-bottom: 10px;
        }

        .br-bt {
            border-bottom: 1px solid #00000033;
        }

        .feature-item {
            padding: 20px 10px 20px 0;
        }

        .feature-item h3 {
            font-weight: 600;
            font-size: 20px;
            line-height: 28px;
        }

        .feature-item p {
            font-size: 18px;
            line-height: 28px;
        }

        /* Timeline Section */
        .timeline-wrapper {
            position: relative;
            background: #231e23;
        }

        .timeline {
            position: sticky;
            top: 0;
            height: 100vh;
            min-height: 550px;
            overflow: hidden;
            display: flex;
            align-items: center;
            background-image: url('/sparkle.webp');
            background-repeat: no-repeat;
            background-size: 60%, cover;
        }

        .timeline-group {
            display: flex;
            flex-direction: column;
            gap: 50px;
            height: 100%;
            justify-content: center;
            margin-top: -60px;
        }

        .timeline-container {
            width: max-content;
            display: flex;
            gap: 40px;
            padding: 20px 50px 70px 124px;
            transition: transform 0.1s ease-out;
            border-bottom: 1px solid #4B474B;
            align-items: center;
            will-change: transform;
            transform: translateZ(0);
        }

        .timeline-item-container {
            max-width: 300px;
            flex-shrink: 0;
            height: 100%;
        }

        .timeline-title-container {
            max-width: 1280px;
            padding-left: 124px;
            align-self: flex-start;
        }

        .timeline-title {
            color: #fff;
            font-size: 58px;
            line-height: 60px;
            font-weight: 400;
        }

        .timeline-title .highlighted-text {
            color: #F94049;
            font-weight: 800;
        }

        .timeline-item-ttile {
            width: 60%;
            height: 50px;
            color: #bababa;
            font-size: 18px;
            line-height: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 0;
        }

        .timeline-item-ttile span {
            display: inline;
            white-space: nowrap;
        }

        .timeline-item-points {
            position: relative;
            height: 100%;
            border-left: 1px dashed transparent;
            border-image: repeating-linear-gradient(to top, #4B474B 6px 15px, transparent 15px 21px) 1;
            border-image-slice: 1;
        }

        .timeline-img-container {
            width: 100px;
            height: 100px;
            border: 1px solid #504c50;
            background-color: #373137;
            border-radius: 14px;
            padding: 6px;
            margin-left: 20px;
        }

        .timeline-img {
            width: 100%;
            height: 100%;
            background-image: url("/inventory/10-years-of-zoho-inventory/timeline-icons@1x.png?v=2"), linear-gradient(137.52deg, #FFF2BC 3.54%, #FFFFFF 68.67%);
            background-repeat: no-repeat;
            background-size: 510px 315px;
            background-position: 20px 20px, center;
            border-radius: 9px;
        }

        .timeline-2015 {
            background-position: -14px -10px, center;
        }

        .timeline-2016 {
            background-position: -106px -10px, center;
        }

        .timeline-2017 {
            background-position: -205px -10px, center;
        }

        .timeline-2018 {
            background-position: -300px -10px, center;
        }

        .timeline-2019 {
            background-position: -400px -10px, center;
        }

        .timeline-2020 {
            background-position: -12px -108px, center;
        }

        .timeline-2021 {
            background-position: -106px -108px, center;
        }

        .timeline-2022 {
            background-position: -206px -108px, center;
        }

        .timeline-2023 {
            background-position: -12px -210px, center;
        }

        .timeline-2024 {
            background-position: -302px -108px, center;
        }

        .timeline-2025 {
            background-position: -400px -108px, center;
        }

        .timeline-item-container-img {
            background: linear-gradient(137.52deg, #FFF2BC 3.54%, #FFFFFF 68.67%);
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
        }

        .timeline-event {
            margin-top: 20px;
            margin-right: 45px;
        }

        .timeline-event li {
            color: #bababa;
            font-size: 16px;
            line-height: 24px;
            padding-left: 20px;
            position: relative;
        }

        .timeline-event li::before {
            content: "";
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
            background-color: #bababa;
            vertical-align: middle;
            position: absolute;
            left: -3px;
            top: 10px;
        }

        .timeline-event li+li {
            margin-top: 20px;
        }

        .timeline-year {
            position: absolute;
            color: #7b7b7b;
            font-size: 22px;
            font-weight: 600;
            bottom: -45px;
            left: -22px;
        }

        /* badges section */

        .badge-section {
            background-color: #fcf8f0;
        }

        .badge-section-inner {
            padding: 150px 0 80px;
        }

        .bedge-title {
            font-size: 42px;
            line-height: 50px;
            margin: 0 auto 30px;
            max-width: 700px;
            text-align: center;
            padding: 0;
        }

        .badges-wrapper {
            display: flex;
            justify-content: center;
        }

        .badges-scroll-section {
            max-width: 1000px;
            width: 100%;
            overflow: hidden;
            margin: 0 20px;
            position: relative;
        }

        .badges-scroll-section::before {
            content: "";
            display: inline-block;
            width: 80px;
            height: 150px;
            background: url(/inventory/10-years-of-zoho-inventory/left-leaf-img.svg);
            background-repeat: no-repeat;
            background-size: cover;
            position: absolute;
            z-index: 200;
            left: 0;
            top: 10px;
        }

        .badges-scroll-section::after {
            content: "";
            display: inline-block;
            width: 80px;
            height: 150px;
            background: url(/inventory/10-years-of-zoho-inventory/right-leaf-img.svg);
            background-repeat: no-repeat;
            background-size: cover;
            position: absolute;
            z-index: 200;
            right: 0;
            top: 10px;
        }

        .badges-scroll-inner {
            height: 120px;
            margin: 40px 90px;
            position: relative;
            overflow: hidden;
        }

        .bades-container {
            display: flex;
            align-items: center;
            justify-items: center;
            position: absolute;
        }

        .bades-block-1 {
            animation-name: sliding-1;
            animation-timing-function:
                linear;
            animation-iteration-count: infinite;
        }

        .bades-block-2 {
            animation-name: sliding-2;
            animation-timing-function:
                linear;
            animation-iteration-count: infinite;
        }

        .bades-block-1,
        .bades-block-2 {
            animation-duration: 30s;
        }

        .badges-scroll-inner:before {
            content: "";
            position: absolute;
            left: -40px;
            width: 40px;
            height: 120px;
            background-color: #fcf8f0;
            top: -10px;
            opacity: 1;
            box-shadow: 2px 2px 20px 20px #fcf8f0;
            z-index: 2;
        }

        .badges-scroll-inner:after {
            content: "";
            position: absolute;
            right: -42px;
            width: 40px;
            height: 120px;
            background-color: #fcf8f0;
            top: -10px;
            opacity: 1;
            box-shadow: -8px 2px 20px 20px #fcf8f0;
        }

        .badge-img {
            margin: 0 18px;
            width: 128px;
            height: 100px;
            border-radius: 10px;
            transition: all .3s;
            background: url(/inventory/10-years-of-zoho-inventory/badges-icon.svg);
            background-repeat: no-repeat;
            background-size: 992px 290px;
            background-position: -22px -30px;
        }

        .badge-1 {
            background-position: -14px -30px;
        }

        .badge-2 {
            background-position: -154px -30px;
        }

        .badge-3 {
            background-position: -313px -30px;
        }

        .badge-4 {
            background-position: -450px -30px;
        }

        .badge-5 {
            background-position: -572px -30px;
        }

        .badge-6 {
            background-position: -696px -30px;
        }

        .badge-7 {
            background-position: -834px -30px;
        }

        .badge-8 {
            background-position: -16px -160px;
        }

        .badge-9 {
            background-position: -158px -160px;
        }

        .badge-10 {
            background-position: -306px -160px;
        }

        .badge-11 {
            background-position: -434px -160px;
        }

        .badge-12 {
            background-position: -572px -160px;
        }

        .badge-13 {
            background-position: -710px -160px
        }

        @keyframes sliding-1 {
            0% {
                transform: translate(-1%);
            }

            100% {
                transform: translate(-101%);
            }
        }

        @keyframes sliding-2 {
            0% {
                transform: translate(99%);
            }

            100% {
                transform: translate(-1%);

<body>
    <div>
        <h2>Before Scroll</h2>
    </div>
    <section class="timeline-wrapper animated-heading-container fadeinup-section" id="timelineWrapper">
        <div class="timeline">
            <div class="timeline-group">
                <div class="timeline-title-container">
                    <h2 class="timeline-title animated-heading">Tracking a decade of <span
                            class="highlighted-text">growth</span></h2>
                </div>
                <div class="timeline-container" id="timelineContainer">
                    {{range .Params.timelineContent}}
                    <div class="timeline-item-container fadeinup4">
                        <h3 class="timeline-item-ttile">{{ .title | safeHTML }}</h3>
                        <div class="timeline-item-points">
                            <div class="timeline-img-container">
                                <div class="timeline-img timeline-{{ .year }}"></div>
                            </div>
                            <ul class="timeline-event">
                                {{range .eventsPoints }}
                                <li>{{ .point }}</li>
                                {{ end }}
                            </ul>
                            <p class="timeline-year">{{ .year }}</p>
                        </div>
                    </div>
                    {{ end }}
                </div>
            </div>
        </div>
    </section>
    <div>
        <h2>After Scroll</h2>
    </div>
    <script>

        var timelineSection = document.getElementById('timelineWrapper');
        var timelineContent = document.getElementById('timelineContainer');
        let currentTranslateX = 0;
        var scrollSpeedFactor = 1;
        let ticking = false;
        function updateTimelineSectionHeight() {
            var timelineWidth = timelineContent.scrollWidth;
            var viewportWidth = window.innerWidth || document.documentElement.clientWidth;
            var horizontalScrollDistance = Math.max(0, timelineWidth - viewportWidth);
            timelineSection.style.height = `${horizontalScrollDistance + window.innerHeight}px`;
        }
        updateTimelineSectionHeight();
        window.addEventListener('resize', updateTimelineSectionHeight);
        function handleTimelineScroll() {
            var sectionRect = timelineSection.getBoundingClientRect();
            var viewportHeight = window.innerHeight || document.documentElement.clientHeight;
            var sectionHeight = timelineSection.offsetHeight;
            var timelineWidth = timelineContent.scrollWidth;
            var viewportWidth = window.innerWidth || document.documentElement.clientWidth;
            var maxTranslateX = Math.max(0, timelineWidth - viewportWidth);
            if (sectionRect.top <= 0 && sectionRect.bottom >= viewportHeight) {
                var scrollProgress = Math.min(1, Math.abs(sectionRect.top) / (sectionHeight - viewportHeight));
                currentTranslateX = Math.round(-maxTranslateX * scrollProgress / scrollSpeedFactor);
            } else if (sectionRect.top > 0) {
                currentTranslateX = 0;
            } else if (sectionRect.bottom < viewportHeight) {
                currentTranslateX = -maxTranslateX;
            }
            timelineContent.style.transform = `translateX(${currentTranslateX}px)`;
            timelineContent.style.webkitTransform = `translateX(${currentTranslateX}px)`;
        }
        function onScroll() {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    handleTimelineScroll();
                    ticking = false;
                });
                ticking = true;
            }
        }
        window.addEventListener('scroll', onScroll, { passive: true });
    </script>
